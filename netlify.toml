[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Pictures never change under the same name, so browsers can keep them for a year.
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pics/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
